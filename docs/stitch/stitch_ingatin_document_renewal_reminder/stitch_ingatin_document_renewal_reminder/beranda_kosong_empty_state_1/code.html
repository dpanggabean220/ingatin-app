<div class="fixed bottom-24 inset-x-margin max-w-sm mx-auto bg-inverse-surface text-inverse-on-surface px-space-md py-space-sm rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-between z-40" id="toastNotification">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-secondary-fixed-dim text-[18px]">check_circle</span>
<span class="font-body-md text-body-md text-inverse-on-surface" id="toastMessage">Membuka formulir...</span>
</div>
<span class="material-symbols-outlined text-[16px] text-outline-variant">close</span>
</div>
</div>
<script>
  (function() {
    const toast = document.getElementById('toastNotification');
    const toastMsg = document.getElementById('toastMessage');
    const mainBtn = document.getElementById('addDocMainBtn');
    const chips = document.querySelectorAll('.quick-chip');
    let toastTimeout;

    function showToast(msg) {
      if (!toast) return;
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2200);
    }

    if (mainBtn) {
      mainBtn.addEventListener('click', function() {
        showToast('Menuju form tambah dokumen baru');
      });
    }

    chips.forEach(chip => {
      chip.addEventListener('click', function() {
        const docName = this.getAttribute('data-doc') || 'dokumen';
        showToast('Membuka formulir: ' + docName);
      });
    });
  })();
